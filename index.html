<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカー戦績・タイムライン管理アプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">⚽ サッカー戦績・タイムライン管理</h1>
            <span id="current-time-display" class="text-xs bg-emerald-700 px-2 py-1 rounded">--:--</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 試合基本情報セクション -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">1. 試合情報設定</h2>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500">日付</label>
                    <input type="date" id="match-date" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                </div>
                <div>
                    <label class="text-xs text-slate-500">試合種別</label>
                    <select id="match-type" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="トレマ">トレマ</option>
                        <option value="公式戦">公式戦</option>
                        <option value="練習">練習</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500">何本目</label>
                    <select id="match-period" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="1本目">1本目</option>
                        <option value="2本目">2本目</option>
                        <option value="3本目">3本目</option>
                        <option value="4本目">4本目</option>
                        <option value="前半">前半</option>
                        <option value="後半">後半</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-500">形式</label>
                    <select id="match-format" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="11">11人制</option>
                        <option value="8">8人制</option>
                        <option value="5">フットサル</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-500">対戦相手</label>
                <input type="text" id="opponent" placeholder="例: ○○FC" class="w-full border rounded p-1.5 text-sm bg-slate-50">
            </div>
        </section>

        <!-- タイマー＆スコアセクション -->
        <section class="bg-emerald-900 text-white p-4 rounded-xl shadow-md text-center space-y-3">
            <div class="text-xs text-emerald-300 uppercase tracking-wider">Live Scoreboard</div>
            <div class="text-4xl font-black tracking-widest">
                <span id="score-us">0</span> - <span id="score-them">0</span>
            </div>
            <div class="flex justify-center items-center space-x-3">
                <span id="timer-display" class="text-3xl font-mono font-bold bg-emerald-950 px-4 py-1 rounded border border-emerald-700">00:00</span>
            </div>
            <div class="flex justify-center gap-2 pt-1">
                <button onclick="startTimer()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3 py-1 rounded text-xs font-bold">開始</button>
                <button onclick="pauseTimer()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold">一時停止</button>
                <button onclick="resetTimer()" class="bg-rose-700 hover:bg-rose-600 text-white px-3 py-1 rounded text-xs font-bold">リセット</button>
            </div>
        </section>

        <!-- イベント記録セクション -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">2. イベント記録</h2>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500">経過時間 (分)</label>
                    <div class="flex gap-1">
                        <input type="number" id="event-minute" min="0" max="90" value="0" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <button onclick="hookCurrentMinute()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 rounded text-xs font-bold whitespace-nowrap">今をセット</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">イベント種別</label>
                    <select id="event-type" class="w-full border rounded p-1.5 text-sm bg-slate-50" onchange="toggleEventInputs()">
                        <option value="得点">⚽ 得点</option>
                        <option value="失点">🥅 失点</option>
                        <option value="交代">🔄 交代</option>
                        <option value="イエローカード">🟨 イエロー</option>
                        <option value="レッドカード">🟥 レッド</option>
                        <option value="メモ">📝 メモ</option>
                    </select>
                </div>
            </div>

            <!-- 得点詳細（得点者・アシスト） -->
            <div id="goal-details" class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded border">
                <div>
                    <label class="text-xs text-slate-500">得点者</label>
                    <select id="goal-scorer" class="w-full border rounded p-1 text-sm bg-white"></select>
                </div>
                <div>
                    <label class="text-xs text-slate-500">アシスト</label>
                    <select id="goal-assister" class="w-full border rounded p-1 text-sm bg-white">
                        <option value="">なし</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-xs text-slate-500">詳細・メモ</label>
                <input type="text" id="event-memo" placeholder="例: ニアサイドへシュート / 交代選手など" class="w-full border rounded p-1.5 text-sm bg-slate-50">
            </div>

            <button onclick="addEvent()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-sm shadow">
                イベントを追加する
            </button>
        </section>

        <!-- タイムライン表示 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">3. 試合タイムライン</h2>
            <div id="timeline-container" class="space-y-2 max-h-60 overflow-y-auto text-sm">
                <p class="text-slate-400 text-center py-2 text-xs">まだイベントはありません</p>
            </div>
        </section>

        <!-- 試合保存＆共有 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">4. 試合の保存・LINE共有</h2>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="saveMatchData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-sm shadow">
                    試合結果を保存
                </button>
                <button onclick="copyLineText()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-2 rounded text-sm shadow">
                    LINE用テキストコピー
                </button>
            </div>
        </section>

        <!-- 過去の試合結果一覧（削除機能付き） -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">5. 過去の試合結果一覧</h2>
            <div id="match-history-container" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-slate-400 text-center py-2 text-xs">読み込み中...</p>
            </div>
        </section>

    </main>

    <!-- JavaScript ロジック -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxN2RoVcENiRoDYy6W8lTb-kybEsNwatPLQKoqIyr4ruMqmNjlwfoT_xOBADeLG6jm4/exec";

        // サンプル選手データ（必要に応じてマスタから取得または入力）
        let players = [
            { id: 1, number: 10, name: "山田 太郎" },
            { id: 2, number: 7, name: "佐藤 健" },
            { id: 3, number: 9, name: "鈴木 一郎" }
        ];

        let matchEvents = [];
        let timerSeconds = 0;
        let timerInterval = null;

        // 初期化
        window.onload = function() {
            document.getElementById('match-date').valueAsDate = new Date();
            updatePlayerSelects();
            loadMatchHistory();
        };

        // 選手セレクトボックスの更新
        function updatePlayerSelects() {
            const scorerSelect = document.getElementById('goal-scorer');
            const assisterSelect = document.getElementById('goal-assister');
            
            scorerSelect.innerHTML = "";
            assisterSelect.innerHTML = "<option value=''>なし</option>";

            players.forEach(p => {
                const opt = `<option value="${p.number}: ${p.name}">[${p.number}] ${p.name}</option>`;
                scorerSelect.innerHTML += opt;
                assisterSelect.innerHTML += opt;
            });
        }

        // イベント種別による入力欄切り替え
        function toggleEventInputs() {
            const type = document.getElementById('event-type').value;
            const goalDetails = document.getElementById('goal-details');
            if (type === '得点') {
                goalDetails.style.display = 'grid';
            } else {
                goalDetails.style.display = 'none';
            }
        }

        // タイマー制御
        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timer-display').textContent = `${mins}:${secs}`;
        }

        function hookCurrentMinute() {
            const currentMins = Math.floor(timerSeconds / 60);
            document.getElementById('event-minute').value = currentMins;
        }

        // イベント追加
        function addEvent() {
            const minute = document.getElementById('event-minute').value;
            const type = document.getElementById('event-type').value;
            const memo = document.getElementById('event-memo').value;
            
            let details = memo;
            if (type === '得点') {
                const scorer = document.getElementById('goal-scorer').value;
                const assister = document.getElementById('goal-assister').value;
                details = `得点者: ${scorer}` + (assister ? ` (A: ${assister})` : "") + (memo ? ` - ${memo}` : "");
            }

            matchEvents.push({ minute, type, details });
            renderTimeline();
            updateScore();

            // 入力クリア
            document.getElementById('event-memo').value = "";
        }

        // スコア自動集計
        function updateScore() {
            let us = 0;
            let them = 0;
            matchEvents.forEach(e => {
                if (e.type === '得点') us++;
                if (e.type === '失点') them++;
            });
            document.getElementById('score-us').textContent = us;
            document.getElementById('score-them').textContent = them;
        }

        // タイムライン描画
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            if (matchEvents.length === 0) {
                container.innerHTML = "<p class='text-slate-400 text-center py-2 text-xs'>まだイベントはありません</p>";
                return;
            }

            container.innerHTML = "";
            matchEvents.forEach((e, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-50 p-2 rounded border text-xs";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-emerald-700">${e.minute}分</span>
                        <span class="font-bold ml-2">${e.type}</span>
                        <span class="text-slate-600 ml-1">${e.details}</span>
                    </div>
                    <button onclick="removeEvent(${index})" class="text-rose-500 hover:underline">削除</button>
                `;
                container.appendChild(div);
            });
        }

        function removeEvent(index) {
            matchEvents.splice(index, 1);
            renderTimeline();
            updateScore();
        }

        // 試合結果の保存
        async function saveMatchData() {
            const date = document.getElementById('match-date').value;
            const matchType = document.getElementById('match-type').value;
            const period = document.getElementById('match-period').value;
            const opponent = document.getElementById('opponent').value || "未設定";
            const us = document.getElementById('score-us').textContent;
            const them = document.getElementById('score-them').textContent;
            
            if (!confirm("この試合結果を保存しますか？")) return;

            const payload = {
                action: "saveMatch",
                timestamp: new Date().getTime(),
                date: date,
                matchType: `${matchType} (${period})`,
                opponent: opponent,
                score: `${us} - ${them}`
            };

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                alert("試合結果を保存しました！");
                loadMatchHistory();
            } catch (e) {
                console.error(e);
                alert("保存に失敗しました。");
            }
        }

        // LINE用テキストコピー
        function copyLineText() {
            const date = document.getElementById('match-date').value;
            const matchType = document.getElementById('match-type').value;
            const period = document.getElementById('match-period').value;
            const opponent = document.getElementById('opponent').value || "未設定";
            const us = document.getElementById('score-us').textContent;
            const them = document.getElementById('score-them').textContent;

            let text = `⚽ 試合結果速報\n【日時】${date}\n【種別】${matchType} ${period}\n【対戦】vs ${opponent}\n【スコア】${us} - ${them}\n\n【タイムライン】\n`;
            
            if (matchEvents.length === 0) {
                text += "記録なし";
            } else {
                matchEvents.forEach(e => {
                    text += `${e.minute}分: ${e.type} ${e.details}\n`;
                });
            }

            navigator.clipboard.writeText(text).then(() => {
                alert("LINE用テキストをコピーしました！");
            });
        }

        // 過去の試合結果の読み込み
        async function loadMatchHistory() {
            try {
                const res = await fetch(`${GAS_URL}?action=getHistory`);
                const historyList = await res.json();
                
                const container = document.getElementById("match-history-container");
                container.innerHTML = "";
                
                if (historyList.length === 0) {
                    container.innerHTML = "<p class='text-slate-400 text-center py-2 text-xs'>保存された試合結果はありません。</p>";
                    return;
                }
                
                historyList.forEach(match => {
                    const card = document.createElement("div");
                    card.className = "border p-2.5 rounded flex justify-between items-center bg-slate-50 text-xs";
                    card.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-700">${match.date} (${match.matchType}) vs ${match.opponent}</p>
                            <p class="text-slate-500">スコア: <span class="font-bold text-slate-700">${match.score}</span></p>
                        </div>
                        <button onclick="deleteMatchData('${match.timestamp}')" class="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded font-bold transition">
                            削除
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById("match-history-container").innerHTML = "<p class='text-rose-500 text-center text-xs'>履歴の読み込みに失敗しました</p>";
            }
        }

        // 試合結果の削除
        async function deleteMatchData(matchKey) {
            if (!confirm("本当にこの試合結果を削除しますか？")) return;

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "deleteMatch", matchKey: matchKey })
                });
                alert("試合結果を削除しました！");
                loadMatchHistory();
            } catch (e) {
                console.error(e);
                alert("削除に失敗しました。");
            }
        }
    </script>
</body>
</html>
