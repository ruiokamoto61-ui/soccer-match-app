<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカー戦績・タイムライン管理アプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">⚽ サッカー戦績・タイムライン管理</h1>
            <span id="current-time-display" class="text-xs bg-emerald-700 px-2 py-1 rounded">--:--</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 1. 選手登録セクション -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">👤 選手登録（ポジション付き）</h2>
            <div class="grid grid-cols-4 gap-2">
                <div>
                    <label class="text-xs text-slate-500">背番号</label>
                    <input type="number" id="player-number" placeholder="10" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                </div>
                <div class="col-span-2">
                    <label class="text-xs text-slate-500">選手名</label>
                    <input type="text" id="player-name" placeholder="山田 太郎" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                </div>
                <div>
                    <label class="text-xs text-slate-500">ポジション</label>
                    <select id="player-pos" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="FW">FW</option>
                        <option value="MF">MF</option>
                        <option value="DF">DF</option>
                        <option value="GK">GK</option>
                    </select>
                </div>
            </div>
            <button onclick="addPlayer()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded text-xs font-bold shadow">
                選手を追加する
            </button>
            <div id="player-list-container" class="flex flex-wrap gap-1 pt-1 max-h-24 overflow-y-auto"></div>
        </section>

        <!-- 2. 試合基本情報セクション -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">2. 試合情報設定</h2>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500">日付</label>
                    <input type="date" id="match-date" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                </div>
                <div>
                    <label class="text-xs text-slate-500">試合種別</label>
                    <select id="match-type" onchange="updateMatchLabel()" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="トレマ">トレマ</option>
                        <option value="公式戦">公式戦</option>
                        <option value="練習">練習</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500">何本目</label>
                    <select id="match-period" onchange="updateMatchLabel()" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="1本目">1本目</option>
                        <option value="2本目">2本目</option>
                        <option value="3本目">3本目</option>
                        <option value="4本目">4本目</option>
                        <option value="前半">前半</option>
                        <option value="後半">後半</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-500">形式</label>
                    <select id="match-format" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <option value="11">11人制</option>
                        <option value="8">8人制</option>
                        <option value="5">フットサル</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-500">対戦相手</label>
                <input type="text" id="opponent" placeholder="例: ○○FC" class="w-full border rounded p-1.5 text-sm bg-slate-50">
            </div>
        </section>

        <!-- 3. タイマー＆スコアセクション -->
        <section class="bg-emerald-900 text-white p-4 rounded-xl shadow-md text-center space-y-3">
            <div id="live-match-label" class="inline-block bg-emerald-800 text-emerald-200 text-xs font-bold px-3 py-0.5 rounded-full border border-emerald-700">
                トレマ (1本目)
            </div>
            <div class="text-4xl font-black tracking-widest">
                <span id="score-us">0</span> - <span id="score-them">0</span>
            </div>
            <div class="flex justify-center items-center space-x-3">
                <span id="timer-display" class="text-3xl font-mono font-bold bg-emerald-950 px-4 py-1 rounded border border-emerald-700">00:00</span>
            </div>
            <div class="flex justify-center gap-2 pt-1">
                <button onclick="startTimer()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3 py-1 rounded text-xs font-bold">開始</button>
                <button onclick="pauseTimer()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold">一時停止</button>
                <button onclick="resetTimer()" class="bg-rose-700 hover:bg-rose-600 text-white px-3 py-1 rounded text-xs font-bold">リセット</button>
            </div>
        </section>

        <!-- 4. スタメン＆出場時間管理セクション -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">3. スタメン・出場状況（リアルタイム）</h2>
            <div id="lineup-container" class="space-y-1.5 max-h-40 overflow-y-auto"></div>
        </section>

        <!-- 5. イベント記録セクション -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">4. イベント記録</h2>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500">経過時間 (分)</label>
                    <div class="flex gap-1">
                        <input type="number" id="event-minute" min="0" max="90" value="0" class="w-full border rounded p-1.5 text-sm bg-slate-50">
                        <button onclick="hookCurrentMinute()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 rounded text-xs font-bold whitespace-nowrap">今をセット</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">イベント種別</label>
                    <select id="event-type" class="w-full border rounded p-1.5 text-sm bg-slate-50" onchange="toggleEventInputs()">
                        <option value="得点">⚽ 得点</option>
                        <option value="失点">🥅 失点</option>
                        <option value="交代">🔄 交代</option>
                        <option value="イエローカード">🟨 イエロー</option>
                        <option value="レッドカード">🟥 レッド</option>
                        <option value="メモ">📝 メモ</option>
                    </select>
                </div>
            </div>

            <div id="goal-details" class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded border">
                <div>
                    <label class="text-xs text-slate-500">得点者</label>
                    <select id="goal-scorer" class="w-full border rounded p-1 text-sm bg-white"></select>
                </div>
                <div>
                    <label class="text-xs text-slate-500">アシスト</label>
                    <select id="goal-assister" class="w-full border rounded p-1 text-sm bg-white">
                        <option value="">なし</option>
                    </select>
                </div>
            </div>

            <div id="sub-details" class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded border" style="display:none;">
                <div>
                    <label class="text-xs text-slate-500">IN (出場選手)</label>
                    <select id="sub-in" class="w-full border rounded p-1 text-sm bg-white"></select>
                </div>
                <div>
                    <label class="text-xs text-slate-500">OUT (退場選手)</label>
                    <select id="sub-out" class="w-full border rounded p-1 text-sm bg-white"></select>
                </div>
            </div>

            <div>
                <label class="text-xs text-slate-500">詳細・メモ</label>
                <input type="text" id="event-memo" placeholder="例: ニアサイドへシュート など" class="w-full border rounded p-1.5 text-sm bg-slate-50">
            </div>

            <button onclick="addEvent()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-sm shadow">
                イベントを追加する
            </button>
        </section>

        <!-- 6. タイムライン表示 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">5. 試合タイムライン</h2>
            <div id="timeline-container" class="space-y-2 max-h-60 overflow-y-auto text-sm">
                <p class="text-slate-400 text-center py-2 text-xs">まだイベントはありません</p>
            </div>
        </section>

        <!-- 7. 試合保存＆共有 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">6. 試合の保存・LINE共有</h2>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="saveMatchData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-sm shadow">
                    試合結果を保存
                </button>
                <button onclick="copyLineText()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-2 rounded text-sm shadow">
                    LINE用テキストコピー
                </button>
            </div>
        </section>

        <!-- 8. 過去の試合結果一覧（ブラウザ保存版） -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-600 border-b pb-1">7. 過去の試合結果一覧</h2>
            <div id="match-history-container" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-slate-400 text-center py-2 text-xs">保存された試合はありません</p>
            </div>
        </section>

    </main>

    <!-- JavaScript ロジック -->
    <script>
        let players = JSON.parse(localStorage.getItem('soccer_players')) || [
            { id: 1, number: 1, name: "GK 選手", pos: "GK" },
            { id: 2, number: 4, name: "DF 選手", pos: "DF" },
            { id: 3, number: 8, name: "MF 選手", pos: "MF" },
            { id: 4, number: 10, name: "山田 太郎", pos: "FW" }
        ];

        let matchEvents = [];
        let timerSeconds = 0;
        let timerInterval = null;
        let playerStatus = {};

        window.onload = function() {
            document.getElementById('match-date').valueAsDate = new Date();
            initPlayerStatus();
            updatePlayerListUI();
            updatePlayerSelects();
            renderLineup();
            updateMatchLabel();
            loadMatchHistory();
        };

        function initPlayerStatus() {
            players.forEach(p => {
                if (!playerStatus[p.id]) {
                    playerStatus[p.id] = { isPlaying: false, playedSeconds: 0 };
                }
            });
        }

        function updateMatchLabel() {
            const type = document.getElementById('match-type').value;
            const period = document.getElementById('match-period').value;
            document.getElementById('live-match-label').textContent = `${type} (${period})`;
        }

        function addPlayer() {
            const number = document.getElementById('player-number').value;
            const name = document.getElementById('player-name').value;
            const pos = document.getElementById('player-pos').value;

            if (!number || !name) {
                alert("背番号と選手名を入力してください！");
                return;
            }

            const newId = Date.now();
            players.push({ id: newId, number, name, pos });
            playerStatus[newId] = { isPlaying: false, playedSeconds: 0 };
            
            saveAndRefreshAll();

            document.getElementById('player-number').value = "";
            document.getElementById('player-name').value = "";
        }

        function removePlayer(id) {
            players = players.filter(p => p.id !== id);
            delete playerStatus[id];
            saveAndRefreshAll();
        }

        function saveAndRefreshAll() {
            localStorage.setItem('soccer_players', JSON.stringify(players));
            updatePlayerListUI();
            updatePlayerSelects();
            renderLineup();
        }

        function updatePlayerListUI() {
            const container = document.getElementById('player-list-container');
            container.innerHTML = "";
            if (players.length === 0) {
                container.innerHTML = "<span class='text-xs text-slate-400'>選手が登録されていません</span>";
                return;
            }
            players.forEach(p => {
                const tag = document.createElement('span');
                tag.className = "inline-flex items-center bg-slate-100 border border-slate-200 rounded px-2 py-0.5 text-xs text-slate-700";
                tag.innerHTML = `[${p.pos}] #${p.number} ${p.name} <button onclick="removePlayer(${p.id})" class="ml-1 text-rose-500 font-bold hover:text-rose-700">×</button>`;
                container.appendChild(tag);
            });
        }

        function updatePlayerSelects() {
            const scorerSelect = document.getElementById('goal-scorer');
            const assisterSelect = document.getElementById('goal-assister');
            const subInSelect = document.getElementById('sub-in');
            const subOutSelect = document.getElementById('sub-out');
            
            scorerSelect.innerHTML = "";
            assisterSelect.innerHTML = "<option value=''>なし</option>";
            subInSelect.innerHTML = "";
            subOutSelect.innerHTML = "";

            players.forEach(p => {
                const opt = `<option value="${p.number}: ${p.name}">[${p.pos}] #${p.number} ${p.name}</option>`;
                scorerSelect.innerHTML += opt;
                assisterSelect.innerHTML += opt;
                subInSelect.innerHTML += opt;
                subOutSelect.innerHTML += opt;
            });
        }

        function renderLineup() {
            const container = document.getElementById('lineup-container');
            container.innerHTML = "";
            if (players.length === 0) {
                container.innerHTML = "<p class='text-xs text-slate-400 text-center'>選手を登録してください</p>";
                return;
            }

            players.forEach(p => {
                const status = playerStatus[p.id] || { isPlaying: false, playedSeconds: 0 };
                const mins = Math.floor(status.playedSeconds / 60);
                const secs = status.playedSeconds % 60;
                const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-50 p-2 rounded border text-xs";
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" ${status.isPlaying ? 'checked' : ''} onchange="togglePlaying(${p.id})" class="w-4 h-4 text-emerald-600 rounded">
                        <span class="font-bold bg-slate-200 px-1 rounded">${p.pos}</span>
                        <span>#${p.number} ${p.name}</span>
                    </div>
                    <span class="font-mono font-bold text-emerald-700">出場: ${timeStr}</span>
                `;
                container.appendChild(div);
            });
        }

        function togglePlaying(id) {
            if (playerStatus[id]) {
                playerStatus[id].isPlaying = !playerStatus[id].isPlaying;
            }
        }

        function toggleEventInputs() {
            const type = document.getElementById('event-type').value;
            const goalDetails = document.getElementById('goal-details');
            const subDetails = document.getElementById('sub-details');

            goalDetails.style.display = 'none';
            subDetails.style.display = 'none';

            if (type === '得点') {
                goalDetails.style.display = 'grid';
            } else if (type === '交代') {
                subDetails.style.display = 'grid';
            }
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();

                for (let id in playerStatus) {
                    if (playerStatus[id].isPlaying) {
                        playerStatus[id].playedSeconds++;
                    }
                }
                renderLineup();
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timer-display').textContent = `${mins}:${secs}`;
        }

        function hookCurrentMinute() {
            const currentMins = Math.floor(timerSeconds / 60);
            document.getElementById('event-minute').value = currentMins;
        }

        function addEvent() {
            const minute = document.getElementById('event-minute').value;
            const type = document.getElementById('event-type').value;
            const memo = document.getElementById('event-memo').value;
            
            let details = memo;
            if (type === '得点') {
                const scorer = document.getElementById('goal-scorer').value;
                const assister = document.getElementById('goal-assister').value;
                details = `得点者: ${scorer}` + (assister ? ` (A: ${assister})` : "") + (memo ? ` - ${memo}` : "");
            } else if (type === '交代') {
                const subIn = document.getElementById('sub-in').value;
                const subOut = document.getElementById('sub-out').value;
                details = `IN: ${subIn} / OUT: ${subOut}` + (memo ? ` (${memo})` : "");
            }

            matchEvents.push({ minute, type, details });
            renderTimeline();
            updateScore();

            document.getElementById('event-memo').value = "";
        }

        function updateScore() {
            let us = 0;
            let them = 0;
            matchEvents.forEach(e => {
                if (e.type === '得点') us++;
                if (e.type === '失点') them++;
            });
            document.getElementById('score-us').textContent = us;
            document.getElementById('score-them').textContent = them;
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            if (matchEvents.length === 0) {
                container.innerHTML = "<p class='text-slate-400 text-center py-2 text-xs'>まだイベントはありません</p>";
                return;
            }

            container.innerHTML = "";
            matchEvents.forEach((e, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-50 p-2 rounded border text-xs";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-emerald-700">${e.minute}分</span>
                        <span class="font-bold ml-2">${e.type}</span>
                        <span class="text-slate-600 ml-1">${e.details}</span>
                    </div>
                    <button onclick="removeEvent(${index})" class="text-rose-500 hover:underline">削除</button>
                `;
                container.appendChild(div);
            });
        }

        function removeEvent(index) {
            matchEvents.splice(index, 1);
            renderTimeline();
            updateScore();
        }

        // 試合結果の保存（ローカルストレージ版：エラーなしで即座に保存・リセット）
        function saveMatchData() {
            const date = document.getElementById('match-date').value;
            const matchType = document.getElementById('match-type').value;
            const period = document.getElementById('match-period').value;
            const opponent = document.getElementById('opponent').value || "未設定";
            const us = document.getElementById('score-us').textContent;
            const them = document.getElementById('score-them').textContent;
            
            if (!confirm("この試合結果を保存しますか？")) return;

            let history = JSON.parse(localStorage.getItem('soccer_match_history')) || [];
            
            const newMatch = {
                timestamp: Date.now(),
                date: date,
                matchType: `${matchType} (${period})`,
                opponent: opponent,
                score: `${us} - ${them}`
            };

            history.unshift(newMatch); // 新しいものを上に追加
            localStorage.setItem('soccer_match_history', JSON.stringify(history));

            alert("試合結果を保存しました！");

            // 状態を全リセット
            matchEvents = [];
            renderTimeline();
            updateScore();
            resetTimer();
            document.getElementById('opponent').value = "";
            
            loadMatchHistory();
        }

        function copyLineText() {
            const date = document.getElementById('match-date').value;
            const matchType = document.getElementById('match-type').value;
            const period = document.getElementById('match-period').value;
            const opponent = document.getElementById('opponent').value || "未設定";
            const us = document.getElementById('score-us').textContent;
            const them = document.getElementById('score-them').textContent;

            let text = `⚽ 試合結果速報\n【日時】${date}\n【種別】${matchType} ${period}\n【対戦】vs ${opponent}\n【スコア】${us} - ${them}\n\n【タイムライン】\n`;
            
            if (matchEvents.length === 0) {
                text += "記録なし";
            } else {
                matchEvents.forEach(e => {
                    text += `${e.minute}分: ${e.type} ${e.details}\n`;
                });
            }

            navigator.clipboard.writeText(text).then(() => {
                alert("LINE用テキストをコピーしました！");
            });
        }

        // 過去の試合結果の読み込み（ローカルストレージ版）
        function loadMatchHistory() {
            const history = JSON.parse(localStorage.getItem('soccer_match_history')) || [];
            const container = document.getElementById("match-history-container");
            container.innerHTML = "";
            
            if (history.length === 0) {
                container.innerHTML = "<p class='text-slate-400 text-center py-2 text-xs'>保存された試合はありません。</p>";
                return;
            }
            
            history.forEach(match => {
                const card = document.createElement("div");
                card.className = "border p-2.5 rounded flex justify-between items-center bg-slate-50 text-xs";
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-700">${match.date} (${match.matchType}) vs ${match.opponent}</p>
                        <p class="text-slate-500">スコア: <span class="font-bold text-slate-700">${match.score}</span></p>
                    </div>
                    <button onclick="deleteMatchData('${match.timestamp}')" class="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded font-bold transition">
                        削除
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // 試合結果の削除（ローカルストレージ版）
        function deleteMatchData(timestamp) {
            if (!confirm("本当にこの試合結果を削除しますか？")) return;

            let history = JSON.parse(localStorage.getItem('soccer_match_history')) || [];
            history = history.filter(m => String(m.timestamp) !== String(timestamp));
            localStorage.setItem('soccer_match_history', JSON.stringify(history));

            alert("試合結果を削除しました！");
            loadMatchHistory();
        }
    </script>
</body>
</html>
